{% extends 'base.html' %}

{% block content %}
    <div class="alt">
        <h1 class="overskriftmat">Våre faste matvarer</h1>
        <div class="gruppert">
            {% for vare in matvarer %}
                <div class="varene">
                    <img src="{{vare.image}}" class="bildemat">
                    <h1>{{vare.navn}}</h1>
                    <p class="beskrivelse">{{vare.beskrivelse}}</p>
                    <p class="pris">{{vare.pris}} kr</p>
                    <button>Kjøp</button>
                </div>
            {% endfor %}
        </div>
    </div>

{% endblock %}
